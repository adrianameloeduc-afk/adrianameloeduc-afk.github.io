<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b97866">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DRI — Minhas Demandas</title>
<style>
:root{--rose:#b97866;--rose2:#d9a08f;--cream:#fffaf6;--ink:#4a3833;--muted:#8d7770;--line:#eadbd5;--green:#6e8b74;--yellow:#c89b45;--red:#b55b58}
*{box-sizing:border-box}body{margin:0;background:#f4ebe6;color:var(--ink);font-family:Arial,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #0001}
header{padding:18px 18px 10px;background:linear-gradient(180deg,#fffaf6,#f8eee9);position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:11px}.brand img{width:54px;height:54px;object-fit:cover;border-radius:50%}.brand h1{font-family:Georgia,serif;font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.content{padding:14px 16px 88px}.date{font-size:13px;color:var(--muted);margin:4px 0 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 4px;text-align:center}.card b{font-size:18px;display:block}.card span{font-size:9px;color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.section h2{font-size:16px;margin:0}.link{font-size:11px;color:var(--rose)}
.add{width:100%;border:0;border-radius:14px;padding:13px;background:var(--rose);color:white;font-weight:bold;font-size:14px;box-shadow:0 7px 18px #b9786633}.quick{display:grid;grid-template-columns:1fr 52px;gap:7px}
.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:7px 0;display:flex;gap:9px;align-items:flex-start}.check{width:22px;height:22px;border:2px solid var(--rose2);border-radius:50%;flex:none;background:#fff;cursor:pointer}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check:after{content:"✓";color:#fff;font-size:14px;display:block;text-align:center;line-height:18px}.task.done .title{text-decoration:line-through;color:#9b8e89}.title{font-size:13.5px;line-height:1.3}.meta{font-size:10px;color:var(--muted);margin-top:5px}.tag{display:inline-block;padding:3px 6px;border-radius:8px;background:#f5e8e2;margin-right:4px}.task-actions{margin-left:auto;display:flex;gap:4px}.tiny{border:0;background:#f8eee9;border-radius:8px;padding:5px 7px;color:var(--rose);font-size:10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:3}.bottom button{border:0;background:none;color:var(--muted);font-size:10px}.bottom button.active{color:var(--rose);font-weight:bold}.bottom .ico{font-size:17px;display:block;margin-bottom:2px}
.view{display:none}.view.active{display:block}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:5;align-items:flex-end}.sheet{width:min(430px,100%);margin:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:19px}.sheet h3{margin:0 0 12px;font-family:Georgia,serif;font-size:20px}label{font-size:11px;color:var(--muted);display:block;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff}.actions .save{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:bold}
.voicebox{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;background:#f5e8e2;color:#6d5953;font-size:11px}.voicebox button{margin-top:7px;border:0;border-radius:9px;padding:8px 11px;background:var(--rose);color:#fff;font-weight:bold}.voice-text{margin-top:5px;line-height:1.4}
.navrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}.navrow button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--rose)}.navtitle{font-weight:bold;font-size:14px}.day{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin:7px 0}.day-head{display:flex;justify-content:space-between;align-items:center}.day strong{font-size:12px}.count{font-size:10px;color:var(--muted)}.mini{font-size:11px;color:var(--muted);margin-top:6px;padding:6px 0;border-top:1px solid #f2e7e2}.empty{color:#b0a19b;font-size:11px;padding:7px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:var(--muted);font-size:9px;padding:3px}.cell{min-height:49px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:10px;cursor:pointer}.cell.muted{opacity:.4}.cell.today{outline:2px solid var(--rose2)}.cell .n{font-weight:bold}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rose);margin:1px}
.history-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin:7px 0}.history-item .when{font-size:9px;color:var(--muted);margin-top:4px}.search{margin:8px 0}.search input{padding:10px}.notice{background:#f8eee9;border-radius:12px;padding:9px;font-size:10px;color:#6d5953;margin-top:9px}
</style>
</head>
<body>
<div class="phone">
<header><div class="brand"><div style="width:54px;height:54px;border-radius:50%;background:#ead7d0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:18px;color:#8c5e53">Dri</div><div><h1>DRI — MINHAS DEMANDAS</h1><p>Organizar para respirar.</p></div></div></header>
<main class="content">
<div class="date" id="todayLabel"></div>
<div class="cards"><div class="card"><b id="late">0</b><span>Atrasadas</span></div><div class="card"><b id="doing">0</b><span>Em andamento</span></div><div class="card"><b id="waiting">0</b><span>Aguardando</span></div><div class="card"><b id="done">0</b><span>Concluídas</span></div></div>

<section id="todayView" class="view active">
<div class="section"><h2>☀️ Hoje</h2><span class="link" onclick="showView('all')">ver tudo</span></div>
<div class="quick"><button class="add" onclick="openSheet()">＋ Nova demanda</button><button class="add" onclick="startVoice()" style="padding:0;font-size:21px">🎙️</button></div>
<div id="voiceBox" class="voicebox"><b>🎙️ Transcrição</b><div id="transcript" class="voice-text"></div><div id="voiceStatus" style="margin-top:5px"></div><button onclick="saveVoice()">Salvar como demanda</button></div>
<div id="todayTasks"></div>
<div class="section"><h2>📥 Caixa de entrada</h2><span class="link" onclick="showView('all')">organizar depois</span></div><div id="inbox"></div>
</section>

<section id="weekView" class="view">
<div class="navrow"><button onclick="shiftWeek(-1)">‹</button><div class="navtitle" id="weekTitle"></div><button onclick="shiftWeek(1)">›</button></div>
<div style="text-align:center;margin-bottom:8px"><button class="tiny" onclick="goCurrentWeek()">Esta semana</button></div>
<div id="weekDays"></div>
</section>

<section id="monthView" class="view">
<div class="navrow"><button onclick="shiftMonth(-1)">‹</button><div class="navtitle" id="monthTitle"></div><button onclick="shiftMonth(1)">›</button></div>
<div class="calendar" id="calendar"></div>
<div class="notice">Toque em um dia para ver as demandas programadas.</div>
<div id="monthDayDetails"></div>
</section>

<section id="historyView" class="view">
<div class="section"><h2>✓ Histórico</h2></div>
<div class="search"><input id="searchInput" placeholder="🔎 Buscar demanda..." oninput="renderHistory()"></div>
<div id="history"></div>
</section>

<section id="allView" class="view">
<div class="section"><h2>📋 Todas as demandas</h2></div><div class="search"><input id="allSearch" placeholder="🔎 Buscar..." oninput="renderAll()"></div><div id="allTasks"></div>
</section>
</main>
<nav class="bottom">
<button class="active" data-view="today" onclick="showView('today')"><span class="ico">☀</span>Hoje</button>
<button data-view="week" onclick="showView('week')"><span class="ico">▦</span>Semana</button>
<button data-view="month" onclick="showView('month')"><span class="ico">▣</span>Mês</button>
<button data-view="history" onclick="showView('history')"><span class="ico">✓</span>Histórico</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet">
<h3 id="sheetTitle">Nova demanda</h3>
<label>O que você precisa fazer?</label><input id="newTitle" placeholder="Digite rapidinho…">
<div class="row"><div><label>Quando?</label><select id="newWhen" onchange="toggleCustomDate()"><option value="today">Hoje</option><option value="tomorrow">Amanhã</option><option value="week">Esta semana</option><option value="custom">Escolher data</option><option value="none">Sem data</option></select></div>
<div><label>Categoria</label><select id="newTag"><option>Trabalho</option><option>Casa</option><option>Financeiro</option><option>Pessoal</option><option>Outros</option></select></div></div>
<div id="customDateWrap" style="display:none"><label>Data</label><input id="newDate" type="date"></div>
<label>Status</label><select id="newStatus"><option value="todo">A fazer</option><option value="doing">Em andamento</option><option value="wait">Aguardando retorno</option><option value="done">Concluída</option></select>
<div class="actions"><button onclick="closeSheet()">Cancelar</button><button class="save" onclick="saveTask()">Salvar demanda</button></div>
</div></div>
</div>
<script>
const KEY='dri_minha_demandas_v5';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
let editingId=null, recognition=null, voiceText='';
let weekOffset=0, monthOffset=0, selectedMonthDay=null;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const startOfWeek=d=>{let x=new Date(d);let day=x.getDay();let diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x};
const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
const today=new Date();today.setHours(0,0,0,0);
document.getElementById('todayLabel').textContent=today.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});

function dateForTask(t){if(t.date)return new Date(t.date+'T00:00:00');return null}
function taskLabel(t){let d=dateForTask(t);return d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'Sem data'}
function statusLabel(s){return {todo:'A fazer',doing:'Em andamento',wait:'Aguardando retorno',done:'Concluída'}[s]||'A fazer'}
function renderCard(t){
 const div=document.createElement('div');div.className='task'+(t.status==='done'?' done':'');
 div.innerHTML=`<div class="check" onclick="finish('${t.id}')"></div><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta"><span class="tag">${esc(t.tag)}</span>${taskLabel(t)} · ${statusLabel(t.status)}</div></div><div class="task-actions"><button class="tiny" onclick="editTask('${t.id}')">Editar</button></div>`;
 return div;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isSame(a,b){return a&&b&&iso(a)===iso(b)}
function renderStats(){
 let late=0,doing=0,wait=0,done=0;tasks.forEach(t=>{if(t.status==='done')done++;else if(t.status==='doing')doing++;else if(t.status==='wait')wait++;if(t.date&&new Date(t.date+'T00:00:00')<today&&t.status!=='done')late++});
 ['late','doing','waiting','done'].forEach((id,i)=>document.getElementById(id).textContent=[late,doing,wait,done][i]);
}
function renderToday(){
 let arr=tasks.filter(t=>t.status!=='done'&&t.date&&isSame(dateForTask(t),today)).sort((a,b)=>a.created-b.created);
 const el=document.getElementById('todayTasks');el.innerHTML='';arr.forEach(t=>el.appendChild(renderCard(t)));
 if(!arr.length)el.innerHTML='<div class="empty">Nenhuma demanda programada para hoje.</div>';
 let inbox=tasks.filter(t=>!t.date&&t.status!=='done');const ib=document.getElementById('inbox');ib.innerHTML='';inbox.forEach(t=>ib.appendChild(renderCard(t)));if(!inbox.length)ib.innerHTML='<div class="empty">Sua caixa de entrada está tranquila.</div>';
}
function weekDate(){let d=startOfWeek(today);d.setDate(d.getDate()+weekOffset*7);return d}
function shiftWeek(n){weekOffset+=n;renderWeek()}
function goCurrentWeek(){weekOffset=0;renderWeek()}
function renderWeek(){
 let s=weekDate(),e=new Date(s);e.setDate(e.getDate()+6);
 document.getElementById('weekTitle').textContent=s.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' – '+e.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
 const box=document.getElementById('weekDays');box.innerHTML='';
 for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);let arr=tasks.filter(t=>t.date&&isSame(dateForTask(t),d)&&t.status!=='done');let el=document.createElement('div');el.className='day';el.innerHTML=`<div class="day-head"><strong>${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).toUpperCase()}</strong><span class="count">${arr.length?arr.length+' demanda(s)':''}</span></div>`;if(arr.length)arr.forEach(t=>{let mini=document.createElement('div');mini.className='mini';mini.innerHTML='☐ '+esc(t.title);mini.onclick=()=>editTask(t.id);el.appendChild(mini)});else{let x=document.createElement('div');x.className='empty';x.textContent='Nenhuma demanda programada';el.appendChild(x)}box.appendChild(el)}
}
function shiftMonth(n){monthOffset+=n;renderMonth()}
function renderMonth(){
 let base=new Date(today.getFullYear(),today.getMonth()+monthOffset,1),y=base.getFullYear(),m=base.getMonth();
 document.getElementById('monthTitle').textContent=base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const cal=document.getElementById('calendar');cal.innerHTML='';['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].forEach(x=>{let d=document.createElement('div');d.className='dow';d.textContent=x;cal.appendChild(d)});
 let first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 for(let i=0;i<start;i++){let c=document.createElement('div');c.className='cell muted';cal.appendChild(c)}
 for(let day=1;day<=days;day++){let d=new Date(y,m,day);let arr=tasks.filter(t=>t.date&&isSame(dateForTask(t),d)&&t.status!=='done');let c=document.createElement('div');c.className='cell'+(isSame(d,today)?' today':'');c.innerHTML='<div class="n">'+day+'</div>'+arr.slice(0,3).map(()=>'<span class="dot"></span>').join('');c.onclick=()=>showMonthDay(d);cal.appendChild(c)}
 document.getElementById('monthDayDetails').innerHTML=selectedMonthDay&&selectedMonthDay.getMonth()===m?monthDetails(selectedMonthDay):'<div class="empty">Toque em um dia para ver suas demandas.</div>';
}
function showMonthDay(d){selectedMonthDay=d;renderMonth()}
function monthDetails(d){let arr=tasks.filter(t=>t.date&&isSame(dateForTask(t),d));let h='<div class="section"><h2>📅 '+d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})+'</h2></div>';if(!arr.length)return h+'<div class="empty">Nenhuma demanda neste dia.</div>';return h+arr.map(t=>'<div class="history-item"><b>'+esc(t.title)+'</b><div class="when">'+esc(t.tag)+' · '+statusLabel(t.status)+' <button class="tiny" onclick="editTask(\''+t.id+'\')">Editar</button></div></div>').join('')}
function renderHistory(){
 let q=(document.getElementById('searchInput').value||'').toLowerCase();let arr=tasks.filter(t=>t.status==='done'&&(!q||t.title.toLowerCase().includes(q)));let h=document.getElementById('history');h.innerHTML='';if(!arr.length){h.innerHTML='<div class="empty">Ainda não há demandas concluídas.</div>';return}arr.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)).forEach(t=>{let x=document.createElement('div');x.className='history-item';x.innerHTML='<b>'+esc(t.title)+'</b><div class="when">'+esc(t.tag)+' · concluída em '+new Date(t.completedAt||t.created).toLocaleString('pt-BR')+'</div>';h.appendChild(x)})
}
function renderAll(){
 let q=(document.getElementById('allSearch').value||'').toLowerCase();let arr=tasks.filter(t=>!q||t.title.toLowerCase().includes(q));let h=document.getElementById('allTasks');h.innerHTML='';arr.sort((a,b)=>b.created-a.created).forEach(t=>h.appendChild(renderCard(t)));if(!arr.length)h.innerHTML='<div class="empty">Nenhuma demanda encontrada.</div>'
}
function showView(v){
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');
 document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
 if(v==='week')renderWeek();if(v==='month')renderMonth();if(v==='history')renderHistory();if(v==='all')renderAll();
}
function openSheet(id=null){
 editingId=id;document.getElementById('sheetTitle').textContent=id?'Editar demanda':'Nova demanda';
 let t=id?tasks.find(x=>x.id===id):null;document.getElementById('newTitle').value=t?t.title:'';document.getElementById('newTag').value=t?t.tag:'Trabalho';document.getElementById('newStatus').value=t?t.status:'todo';
 if(t&&t.date){document.getElementById('newWhen').value='custom';document.getElementById('newDate').value=t.date}else{document.getElementById('newWhen').value=t?'none':'today';document.getElementById('newDate').value=''}toggleCustomDate();document.getElementById('overlay').style.display='flex';setTimeout(()=>document.getElementById('newTitle').focus(),80)
}
function closeSheet(){document.getElementById('overlay').style.display='none'}
function toggleCustomDate(){document.getElementById('customDateWrap').style.display=document.getElementById('newWhen').value==='custom'?'block':'none'}
function selectedDate(){
 let w=document.getElementById('newWhen').value,d=new Date(today);
 if(w==='today')return iso(d);if(w==='tomorrow'){d.setDate(d.getDate()+1);return iso(d)}if(w==='custom')return document.getElementById('newDate').value||null;if(w==='week'){d=startOfWeek(d);d.setDate(d.getDate()+4);return iso(d)}return null
}
function saveTask(){
 let title=document.getElementById('newTitle').value.trim();if(!title)return;
 let data={title,tag:document.getElementById('newTag').value,status:document.getElementById('newStatus').value,date:selectedDate()};
 if(editingId){let t=tasks.find(x=>x.id===editingId);Object.assign(t,data);if(t.status==='done'&&!t.completedAt)t.completedAt=Date.now();if(t.status!=='done')delete t.completedAt}else tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...data,created:Date.now()});
 save();closeSheet();renderAllViews()
}
function editTask(id){openSheet(id)}
function finish(id){let t=tasks.find(x=>x.id===id);if(!t)return;t.status='done';t.completedAt=Date.now();save();renderAllViews()}
function deleteTask(id){if(confirm('Excluir esta demanda?')){tasks=tasks.filter(t=>t.id!==id);save();renderAllViews()}}
function renderAllViews(){renderStats();renderToday();renderWeek();renderMonth();renderHistory();if(document.getElementById('allView').classList.contains('active'))renderAll()}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('voiceBox').style.display='block';document.getElementById('transcript').textContent='';document.getElementById('voiceStatus').textContent='Preparando o microfone…';voiceText='';
 if(!SR){document.getElementById('voiceStatus').textContent='O reconhecimento de voz não está disponível neste navegador.';return}
 recognition=new SR();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=true;
 recognition.onstart=()=>document.getElementById('voiceStatus').textContent='Pode falar. A Dri vai transformar sua fala em texto — sem reproduzir o áudio.';
 recognition.onresult=e=>{let finalText='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){let p=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=p;else interim+=p}voiceText=(voiceText+' '+finalText).trim();document.getElementById('transcript').textContent=(voiceText+' '+interim).trim()};
 recognition.onerror=e=>document.getElementById('voiceStatus').textContent='Não consegui captar a fala ('+e.error+'). Verifique a permissão do microfone.';
 recognition.onend=()=>{if(voiceText)document.getElementById('voiceStatus').textContent='Transcrição pronta. Confira e salve.'};
 recognition.start()
}
function saveVoice(){
 let text=document.getElementById('transcript').textContent.trim();if(!text)return;
 let low=text.toLowerCase(),date=null;
 let m=low.match(/\b(?:dia\s*)?([0-3]?\d)[\/\-](\d{1,2})(?:\/(\d{2,4}))?\b/);
 if(m){let yy=m[3]?Number(m[3]):today.getFullYear();if(yy<100)yy+=2000;date=yy+'-'+pad(Number(m[2]))+'-'+pad(Number(m[1]))}
 else if(low.includes('amanhã')){let d=new Date(today);d.setDate(d.getDate()+1);date=iso(d)}
 else {let names=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];for(let i=0;i<7;i++)if(low.includes(names[i])){let d=new Date(today),delta=(i-d.getDay()+7)%7;if(delta===0)delta=7;d.setDate(d.getDate()+delta);date=iso(d);break}}
 tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title:text.replace(/^dri[,:]?\s*/i,''),tag:'Trabalho',status:'todo',date,created:Date.now()});save();renderAllViews();document.getElementById('voiceStatus').textContent='Demanda salva'+(date?' para '+new Date(date+'T00:00:00').toLocaleDateString('pt-BR'):'');}
renderAllViews();
</script>
</body>
</html>
