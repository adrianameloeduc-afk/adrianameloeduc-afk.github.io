<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b97866">
<title>DRI — Minhas Demandas</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--rose:#b97866;--rose2:#d9a08f;--cream:#fffaf6;--ink:#4a3833;--muted:#8d7770;--line:#eadbd5;--green:#6e8b74;--red:#b55b58;--soft:#f5e8e2}
*{box-sizing:border-box}body{margin:0;background:#f4ebe6;color:var(--ink);font-family:Arial,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #0001}
header{padding:18px 20px 12px;background:linear-gradient(180deg,#fffaf6,#f8eee9);position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:cover;border-radius:50%}.brand h1{font-family:Georgia,serif;font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;letter-spacing:.3px}
.content{padding:14px 18px 92px}.date{font-size:13px;color:var(--muted);margin:4px 0 14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 5px;text-align:center}.card b{font-size:19px;display:block}.card span{font-size:10px;color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 10px}.section h2{font-size:16px;margin:0}.link{font-size:12px;color:var(--rose);cursor:pointer}.addrow{display:grid;grid-template-columns:1fr 54px;gap:8px}.add{width:100%;border:0;border-radius:15px;padding:14px;background:var(--rose);color:white;font-weight:bold;font-size:15px;box-shadow:0 7px 18px #b9786633}.voiceBtn{padding:0;font-size:21px}
.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}.check{width:22px;height:22px;border:2px solid var(--rose2);border-radius:50%;flex:none;background:#fff;cursor:pointer}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check:after{content:"✓";color:#fff;font-size:14px;display:block;text-align:center;line-height:18px}.task.done .title{text-decoration:line-through;color:#9b8e89}.taskbody{min-width:0;flex:1}.title{font-size:14px;line-height:1.3}.meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.tag{display:inline-block;padding:3px 6px;border-radius:8px;background:var(--soft);margin-right:4px}.due.late{color:var(--red);font-weight:bold}.due.today{color:var(--rose);font-weight:bold}.editHint{font-size:10px;color:#aa9188;margin-top:4px}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:14px;background:#fff}.week{display:none}.weekday{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.weekday strong{font-size:13px}.mini{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}.mini.done{text-decoration:line-through}.history{display:none}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:3}.bottom button{border:0;background:none;color:var(--muted);font-size:10px}.bottom button.active{color:var(--rose);font-weight:bold}.bottom .ico{font-size:18px;display:block;margin-bottom:2px}
.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:5;align-items:flex-end}.sheet{width:min(430px,100%);max-height:92vh;overflow:auto;margin:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:20px}.sheet h3{margin:0 0 14px;font-family:Georgia,serif;font-size:20px}label{font-size:11px;color:var(--muted);display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff}.actions .save{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:bold}.delete{background:#fff5f4!important;color:var(--red);border-color:#ecc9c6!important}.customDate{display:none;margin-top:8px}.voicebox{display:none;margin-top:10px;padding:12px;border-radius:14px;background:var(--soft);font-size:11px}.voicebox .transcript{margin-top:6px;line-height:1.45;font-size:13px}.voicebox button{margin-top:9px;border:0;border-radius:10px;padding:10px 12px;background:var(--rose);color:#fff;font-weight:bold}.voiceStatus{margin-top:7px;color:#9a7064}.small{font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="phone">
<header><div class="brand">
<img src="dri.jpg" alt="Dri"> alt="DRI">
<div><h1>DRI — MINHAS DEMANDAS</h1><p>Organizar para respirar.</p></div></div></header>
<main class="content">
<div class="date" id="todayLabel"></div>
<div class="cards"><div class="card"><b id="late">0</b><span>Atrasadas</span></div><div class="card"><b id="doing">0</b><span>Em andamento</span></div><div class="card"><b id="waiting">0</b><span>Aguardando</span></div><div class="card"><b id="done">0</b><span>Concluídas</span></div></div>
<div id="todayView"><div class="section"><h2>☀️ Hoje</h2><span class="link" onclick="showAllToday()">ver tudo</span></div>
<div class="addrow"><button class="add" onclick="openSheet()">＋ Nova demanda</button><button class="add voiceBtn" onclick="startVoice()" title="Adicionar por voz">🎙️</button></div>
<div id="voiceBox" class="voicebox"><b>🎙️ Transcrição</b><div id="transcript" class="transcript"></div><div id="voiceStatus" class="voiceStatus"></div><button onclick="saveVoiceTask()">Usar esta transcrição</button></div>
<div id="tasks"></div></div>
<div id="weekView" class="week"><div class="section"><h2>📅 Próximos 7 dias</h2></div><div id="weekList"></div></div>
<div id="historyView" class="history"><div class="section"><h2>✓ Histórico</h2></div><div id="historyList"></div></div>
</main>
<nav class="bottom"><button id="navToday" class="active" onclick="show('today',this)"><span class="ico">☀</span>Hoje</button><button id="navWeek" onclick="show('week',this)"><span class="ico">▦</span>Semana</button><button id="navHistory" onclick="show('history',this)"><span class="ico">✓</span>Histórico</button><button onclick="openSheet()"><span class="ico">＋</span>Adicionar</button></nav>
<div class="overlay" id="overlay"><div class="sheet"><h3 id="sheetTitle">Nova demanda</h3><label>O que você precisa fazer?</label><input id="newTitle" placeholder="Digite rapidinho…">
<div class="row"><div><label>Quando?</label><select id="newDate" onchange="toggleCustomDate()"><option value="today">Hoje</option><option value="tomorrow">Amanhã</option><option value="week">Esta semana</option><option value="custom">Escolher data</option><option value="none">Sem data</option></select><div id="customDateWrap" class="customDate"><input id="customDate" type="date"></div></div>
<div><label>Categoria</label><select id="newTag"><option>Trabalho</option><option>Casa</option><option>Financeiro</option><option>Pessoal</option><option>Outros</option></select></div></div>
<label>Status</label><select id="newStatus"><option value="todo">A fazer</option><option value="doing">Em andamento</option><option value="wait">Aguardando retorno</option><option value="done">Concluída</option></select>
<div class="actions"><button onclick="closeSheet()">Cancelar</button><button id="deleteBtn" class="delete" style="display:none" onclick="deleteCurrent()">Excluir</button><button class="save" onclick="saveTask()">Salvar demanda</button></div><div class="small" style="margin-top:9px">Você poderá tocar em qualquer demanda depois para editar texto, data, categoria ou status.</div></div></div>
<script>
const KEY='dri_tasks_v4';
const initialTasks=[
 {id:1,t:'Conferir avaliações do 2º ano',tag:'Trabalho',status:'doing',due:addDaysISO(0),created:Date.now()-300000},
 {id:2,t:'Responder professora sobre avaliação',tag:'Trabalho',status:'doing',due:addDaysISO(0),created:Date.now()-200000},
 {id:3,t:'Verificar documento pendente',tag:'Aguardando retorno',status:'wait',due:addDaysISO(1),created:Date.now()-100000},
 {id:4,t:'Organizar reunião de amanhã',tag:'Trabalho',status:'doing',due:addDaysISO(1),created:Date.now()-50000}
];
let tasks=loadTasks(), editingId=null, recognition=null, voiceText='';
function addDaysISO(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
function iso(d){return d.toISOString().slice(0,10)}
function parseDateLocal(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function todayISO(){return iso(new Date())}
function loadTasks(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:initialTasks}catch(e){return initialTasks}}
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function dateLabel(v){if(!v)return 'Sem data';const d=parseDateLocal(v);const t=parseDateLocal(todayISO());const diff=Math.round((d-t)/86400000);if(diff===0)return 'Hoje';if(diff===1)return 'Amanhã';if(diff===-1)return 'Ontem';return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function fullDate(v){if(!v)return 'Sem data';return parseDateLocal(v).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}
function statusLabel(s){return s==='doing'?'Em andamento':s==='wait'?'Aguardando retorno':s==='done'?'Concluída':'A fazer'}
function render(){
 const today=todayISO();const open=tasks.filter(x=>x.status!=='done');
 document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
 document.getElementById('late').textContent=open.filter(x=>x.due&&x.due<today).length;
 document.getElementById('doing').textContent=tasks.filter(x=>x.status==='doing').length;
 document.getElementById('waiting').textContent=tasks.filter(x=>x.status==='wait').length;
 document.getElementById('done').textContent=tasks.filter(x=>x.status==='done').length;
 const list=tasks.filter(x=>x.due===today || (!x.due && x.status!=='done')).sort(sortTasks);
 const el=document.getElementById('tasks');el.innerHTML=list.length?list.map(taskHTML).join(''):'<div class="empty">Nenhuma demanda para hoje.</div>';
 renderWeek();renderHistory();
}
function sortTasks(a,b){return (a.status==='done')-(b.status==='done') || (a.due||'9999').localeCompare(b.due||'9999') || (b.created||0)-(a.created||0)}
function taskHTML(x){const late=x.status!=='done'&&x.due&&x.due<todayISO();const due=x.due?dateLabel(x.due):'Sem data';return `<div class="task ${x.status==='done'?'done':''}" onclick="editTask(${x.id})"><div class="check" onclick="event.stopPropagation();finish(${x.id})"></div><div class="taskbody"><div class="title">${esc(x.t)}</div><div class="meta"><span class="tag">${esc(x.tag)}</span><span class="due ${late?'late':''} ${x.due===todayISO()?'today':''}">${due}</span> · ${statusLabel(x.status)}</div><div class="editHint">Toque para editar</div></div></div>`}
function finish(id){const x=tasks.find(t=>t.id===id);if(!x)return;x.status=x.status==='done'?'todo':'done';x.completedAt=x.status==='done'?Date.now():null;persist();render()}
function openSheet(id=null){editingId=id;document.getElementById('overlay').style.display='flex';document.getElementById('sheetTitle').textContent=id?'Editar demanda':'Nova demanda';document.getElementById('deleteBtn').style.display=id?'block':'none';if(id){const x=tasks.find(t=>t.id===id);fillForm(x)}else{clearForm()}setTimeout(()=>document.getElementById('newTitle').focus(),80)}
function editTask(id){openSheet(id)}
function clearForm(){document.getElementById('newTitle').value='';document.getElementById('newDate').value='today';document.getElementById('customDate').value='';document.getElementById('newTag').value='Trabalho';document.getElementById('newStatus').value='todo';toggleCustomDate()}
function fillForm(x){document.getElementById('newTitle').value=x.t;document.getElementById('newTag').value=x.tag||'Trabalho';document.getElementById('newStatus').value=x.status||'todo';const t=todayISO();const tomorrow=addDaysISO(1);if(!x.due)document.getElementById('newDate').value='none';else if(x.due===t)document.getElementById('newDate').value='today';else if(x.due===tomorrow)document.getElementById('newDate').value='tomorrow';else {document.getElementById('newDate').value='custom';document.getElementById('customDate').value=x.due}toggleCustomDate()}
function toggleCustomDate(){document.getElementById('customDateWrap').style.display=document.getElementById('newDate').value==='custom'?'block':'none'}
function selectedDue(){const v=document.getElementById('newDate').value;if(v==='today')return todayISO();if(v==='tomorrow')return addDaysISO(1);if(v==='week')return addDaysISO(7);if(v==='custom')return document.getElementById('customDate').value||null;return null}
function saveTask(){const t=document.getElementById('newTitle').value.trim();if(!t)return;const item={t,tag:document.getElementById('newTag').value,status:document.getElementById('newStatus').value,due:selectedDue()};if(editingId){const x=tasks.find(z=>z.id===editingId);Object.assign(x,item)}else{tasks.unshift({id:Date.now(),created:Date.now(),...item})}persist();closeSheet();render()}
function deleteCurrent(){if(!editingId)return;if(confirm('Excluir esta demanda?')){tasks=tasks.filter(x=>x.id!==editingId);persist();closeSheet();render()}}
function closeSheet(){document.getElementById('overlay').style.display='none';editingId=null}
function renderWeek(){const base=new Date();base.setHours(12,0,0,0);let html='';for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const key=iso(d);const arr=tasks.filter(x=>x.due===key).sort(sortTasks);html+=`<div class="weekday"><strong>${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).toUpperCase()}</strong>${arr.length?arr.map(x=>`<div class="mini ${x.status==='done'?'done':''}" onclick="editTask(${x.id})">${x.status==='done'?'✓':'☐'} ${esc(x.t)}</div>`).join(''):'<div class="mini">— Nenhuma demanda programada</div>'}</div>`}document.getElementById('weekList').innerHTML=html}
function renderHistory(){const arr=tasks.filter(x=>x.status==='done').sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));document.getElementById('historyList').innerHTML=arr.length?arr.map(x=>`<div class="task done" onclick="editTask(${x.id})"><div class="check"></div><div class="taskbody"><div class="title">${esc(x.t)}</div><div class="meta"><span class="tag">${esc(x.tag)}</span>${x.completedAt?'Concluída em '+new Date(x.completedAt).toLocaleDateString('pt-BR'):''}</div></div></div>`).join(''):'<div class="empty">Ainda não há demandas concluídas.</div>'}
function show(which,btn){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('todayView').style.display=which==='today'?'block':'none';document.getElementById('weekView').style.display=which==='week'?'block':'none';document.getElementById('historyView').style.display=which==='history'?'block':'none'}
function showAllToday(){show('today',document.getElementById('navToday'));document.getElementById('tasks').scrollIntoView({behavior:'smooth'})}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const box=document.getElementById('voiceBox'),tr=document.getElementById('transcript'),st=document.getElementById('voiceStatus');box.style.display='block';tr.textContent='';st.textContent='Preparando o microfone…';voiceText='';if(!SR){st.textContent='Este navegador não oferece reconhecimento de voz. Você pode digitar a demanda.';return}recognition=new SR();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>st.textContent='Pode falar. A Dri vai transformar sua fala em texto — sem armazenar o áudio.';recognition.onresult=e=>{let finalText='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const p=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=p;else interim+=p}voiceText=(voiceText+' '+finalText).trim();tr.textContent=(voiceText+' '+interim).trim()};recognition.onerror=e=>st.textContent='Não consegui captar a fala ('+e.error+'). Tente novamente.';recognition.onend=()=>{if(voiceText)st.textContent='Transcrição pronta. Confira antes de salvar.'};recognition.start()}
function parseVoiceDate(text){const low=text.toLowerCase();if(low.includes('sem data'))return null;if(low.includes('amanhã'))return addDaysISO(1);if(low.includes('hoje'))return todayISO();let m=low.match(/(?:dia\s*)?(\d{1,2})(?:\s*de\s*(janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro))?/);if(m){const day=Number(m[1]);if(day>=1&&day<=31){let month=new Date().getMonth();const names=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];if(m[2])month=names.indexOf(m[2]);let year=new Date().getFullYear();let d=new Date(year,month,day,12);if(d<new Date(new Date().setHours(0,0,0,0))&&!m[2])d=new Date(year,month+1,day,12);return iso(d)}}const days={domingo:0,segunda:1,'segunda-feira':1,terça:2,'terça-feira':2,quarta:3,'quarta-feira':3,quinta:4,'quinta-feira':4,sexta:5,'sexta-feira':5,sábado:6,'sábado':6};for(const k in days)if(low.includes(k)){const d=new Date();const delta=(days[k]-d.getDay()+7)%7||7;d.setDate(d.getDate()+delta);return iso(d)}return todayISO()}
function saveVoiceTask(){const text=document.getElementById('transcript').textContent.trim();if(!text)return;const cleaned=text.replace(/^dri[,:]?\s*/i,'');tasks.unshift({id:Date.now(),created:Date.now(),t:cleaned,tag:'Trabalho',status:'todo',due:parseVoiceDate(cleaned)});persist();render();document.getElementById('voiceStatus').textContent='Demanda salva com a data identificada. Você pode tocar nela para editar.'}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</div></body></html>
